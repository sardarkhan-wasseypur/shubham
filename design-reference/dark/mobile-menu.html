<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Advocate Shubham Singh — Open Mobile Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0A0A0A;
      color: #F7F5F0;
      width: 390px;
      min-height: 844px;
      margin: 0 auto;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .font-cormorant {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    .font-bebas {
      font-family: 'Bebas Neue', sans-serif;
    }
  </style>
</head>
<body class="bg-[#0A0A0A] text-[#F7F5F0] flex flex-col justify-between min-h-[844px] w-[390px] relative selection:bg-[#C8102E] selection:text-white">

  <!-- TOP HEADER / CHROME -->
  <header class="w-full px-5 pt-6 pb-4 flex items-center justify-between border-b border-[#2A2A2A]/80 z-20">
    <!-- Red SS Monogram -->
    <a href="#" class="flex items-center gap-2.5 group">
      <div class="w-9 h-9 bg-[#C8102E] text-white flex items-center justify-center font-bebas text-xl tracking-wider shadow-sm transition-transform group-hover:scale-95">
        SS
      </div>
      <div class="flex flex-col">
        <span class="font-bebas text-[15px] tracking-widest text-[#F7F5F0] leading-none">SHUBHAM SINGH</span>
        <span class="text-[9px] uppercase tracking-[0.22em] text-[#8E8D8A] font-medium mt-0.5">CHAMBER NAVIGATION</span>
      </div>
    </a>

    <!-- CLOSE button -->
    <button class="flex items-center gap-2 py-2 px-3 text-[#F7F5F0] hover:text-[#C8102E] transition-colors focus:outline-none group">
      <span class="text-[12px] font-semibold tracking-[0.25em] uppercase text-[#F7F5F0] group-hover:text-[#C8102E]">CLOSE</span>
      <div class="w-7 h-7 rounded-none border border-[#2A2A2A] flex items-center justify-center text-sm group-hover:border-[#C8102E] group-hover:bg-[#C8102E]/10 transition-colors">
        <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square">
          <path d="M3 3L13 13M13 3L3 13" />
        </svg>
      </div>
    </button>
  </header>

  <!-- MAIN NAVIGATION LINKS -->
  <main class="flex-1 flex flex-col justify-center px-6 py-6">
    <div class="mb-3">
      <span class="text-[10px] tracking-[0.28em] text-[#FF5A6E] font-semibold uppercase flex items-center gap-2">
        <span class="inline-block w-4 h-[1px] bg-[#C8102E]"></span>
        INDEX & DIRECTORY
      </span>
    </div>

    <nav class="flex flex-col">
      <!-- 01 HOME -->
      <a href="#" class="group py-4 border-b border-[#2A2A2A] flex items-baseline justify-between transition-colors hover:border-[#C8102E]/60">
        <div class="flex items-baseline gap-3">
          <span class="font-bebas text-[17px] text-[#C8102E] tracking-wider w-6">01</span>
          <span class="font-cormorant text-[40px] font-medium leading-none tracking-tight text-[#F7F5F0] group-hover:text-[#FF5A6E] transition-colors">HOME</span>
        </div>
        <span class="text-[#8E8D8A] text-xs font-mono group-hover:text-[#C8102E] transition-transform group-hover:translate-x-1">→</span>
      </a>

      <!-- 02 PRACTICE AREAS -->
      <a href="#" class="group py-4 border-b border-[#2A2A2A] flex items-baseline justify-between transition-colors hover:border-[#C8102E]/60">
        <div class="flex items-baseline gap-3">
          <span class="font-bebas text-[17px] text-[#C8102E] tracking-wider w-6">02</span>
          <span class="font-cormorant text-[40px] font-medium leading-none tracking-tight text-[#F7F5F0] group-hover:text-[#FF5A6E] transition-colors">PRACTICE AREAS</span>
        </div>
        <span class="text-[#8E8D8A] text-xs font-mono group-hover:text-[#C8102E] transition-transform group-hover:translate-x-1">→</span>
      </a>

      <!-- 03 EXPERIENCE -->
      <a href="#" class="group py-4 border-b border-[#2A2A2A] flex items-baseline justify-between transition-colors hover:border-[#C8102E]/60">
        <div class="flex items-baseline gap-3">
          <span class="font-bebas text-[17px] text-[#C8102E] tracking-wider w-6">03</span>
          <span class="font-cormorant text-[40px] font-medium leading-none tracking-tight text-[#F7F5F0] group-hover:text-[#FF5A6E] transition-colors">EXPERIENCE</span>
        </div>
        <span class="text-[#8E8D8A] text-xs font-mono group-hover:text-[#C8102E] transition-transform group-hover:translate-x-1">→</span>
      </a>

      <!-- 04 INSIGHTS -->
      <a href="#" class="group py-4 border-b border-[#2A2A2A] flex items-baseline justify-between transition-colors hover:border-[#C8102E]/60">
        <div class="flex items-baseline gap-3">
          <span class="font-bebas text-[17px] text-[#C8102E] tracking-wider w-6">04</span>
          <span class="font-cormorant text-[40px] font-medium leading-none tracking-tight text-[#F7F5F0] group-hover:text-[#FF5A6E] transition-colors">INSIGHTS</span>
        </div>
        <span class="text-[#8E8D8A] text-xs font-mono group-hover:text-[#C8102E] transition-transform group-hover:translate-x-1">→</span>
      </a>

      <!-- 05 CONTACT -->
      <a href="#" class="group py-4 border-b border-[#2A2A2A] flex items-baseline justify-between transition-colors hover:border-[#C8102E]/60">
        <div class="flex items-baseline gap-3">
          <span class="font-bebas text-[17px] text-[#C8102E] tracking-wider w-6">05</span>
          <span class="font-cormorant text-[40px] font-medium leading-none tracking-tight text-[#F7F5F0] group-hover:text-[#FF5A6E] transition-colors">CONTACT</span>
        </div>
        <span class="text-[#8E8D8A] text-xs font-mono group-hover:text-[#C8102E] transition-transform group-hover:translate-x-1">→</span>
      </a>
    </nav>
  </main>

  <!-- BOTTOM UTILITY & FOOTER AREA -->
  <footer class="w-full px-6 pt-5 pb-8 border-t border-[#2A2A2A] bg-[#0E0E0E] flex flex-col gap-4">
    <!-- GET IN TOUCH Button -->
    <a href="#" class="w-full bg-[#C8102E] hover:bg-[#A50D24] text-white py-3.5 px-5 flex items-center justify-between font-semibold text-xs tracking-[0.2em] uppercase transition-colors shadow-sm">
      <span>GET IN TOUCH</span>
      <span class="font-mono text-sm leading-none">→</span>
    </a>

    <!-- Theme Switch & Subtitle Bar -->
    <div class="flex items-center justify-between pt-1 text-[11px]">
      <!-- Small Light / Dark Theme Switch -->
      <div class="flex items-center gap-1.5">
        <span class="text-[#8E8D8A] tracking-wider text-[10px] uppercase font-mono mr-1">THEME:</span>
        <div class="inline-flex p-0.5 bg-[#181818] border border-[#2A2A2A]">
          <button class="px-2.5 py-1 text-[10px] font-medium tracking-wider uppercase text-[#8E8D8A] hover:text-[#F7F5F0] transition-colors">
            Light
          </button>
          <button class="px-2.5 py-1 text-[10px] font-semibold tracking-wider uppercase bg-[#242424] text-[#F7F5F0] shadow-sm border border-[#3A3A3A]/60">
            Dark
          </button>
        </div>
      </div>

      <!-- Line: Advocate · Delhi, India -->
      <div class="text-right">
        <span class="text-[#A3A19D] font-cormorant italic text-[15px] tracking-wide">Advocate · Delhi, India</span>
      </div>
    </div>

    <!-- Chamber Registration Micro-Note -->
    <div class="pt-2 border-t border-[#222222] flex items-center justify-between text-[9px] text-[#6E6D6A] font-mono tracking-wider">
      <span>CHAMBER OF ADV. SHUBHAM SINGH</span>
      <span>NEW DELHI</span>
    </div>
  </footer>

</body>
</html>
